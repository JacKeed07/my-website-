      <!------- Chat Area ------->
      <main>
        <section class="chatbox">
          <!-- LevelUp: the user's latest question, shown above the response -->
          <div id="currentQuestion" class="current-question" hidden></div>

          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <div class="suggestions">
            <button type="button" class="chip">
              What's the difference between a serum and a treatment product?
            </button>
            <button type="button" class="chip">
              Recommend a skincare routine for dry skin
            </button>
            <button type="button" class="chip">
              Which foundation shade is right for warm skin tones?
            </button>
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
          <p class="demo-note" id="demoNote" hidden>
            Demo replies — connect the live AI for full answers.
          </p>
        </section>
